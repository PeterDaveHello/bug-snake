name: CI Checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format:check
        run: npm run format:check

      - name: Run check:js
        run: npm run check:js

      - name: Run check:i18n
        run: npm run check:i18n

      - name: Run test:core
        run: npm run test:core

      - name: Run lint
        run: npm run lint
