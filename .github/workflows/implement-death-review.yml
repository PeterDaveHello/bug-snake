name: Materialize Death Review

on:
  push:
    branches: [materializeDeathReview]

permissions:
  contents: read

concurrency:
  group: materialize-death-review
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'PeterDaveHello/bug-snake'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Reconstruct implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/tools
          cat .github/death-review-payload/part{00..07} \
            | base64 --decode \
            | gzip --decompress \
            > scripts/tools/apply-death-review.mjs
          node --check scripts/tools/apply-death-review.mjs
          node scripts/tools/apply-death-review.mjs
          rm -rf .github/death-review-payload

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Format implementation
        run: npm run format

      - name: Run repository checks
        run: npm run check

      - name: Run Markdown lint
        run: npm run lint:md

      - name: Verify formatting
        run: npm run format:check

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit verified source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/implement-death-review.yml
          test ! -e scripts/tools/apply-death-review.mjs
          test ! -e .github/death-review-payload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && {
            echo 'No materialized changes were produced.' >&2
            exit 1
          }
          git commit -m 'Materialize death review implementation'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
